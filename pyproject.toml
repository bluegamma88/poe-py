[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "poe-py"
version = "0.1.0"
description = "A small coding agent with a Textual terminal interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "httpx2>=2.5,<3",
    "mcp>=2.2,<3",
    "python-dotenv>=1.1,<2",
    "textual>=8.2.7,<9",
]

[project.scripts]
poe-py = "poe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/poe"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
